<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Desk · BOVA11 · v2</title>
<style>
  :root{
    --bg:#0b0f14;--panel:#121821;--panel2:#0e141c;--border:#1e2733;
    --txt:#c9d4e0;--muted:#6b7a8d;--cyan:#38e1e1;--cyan2:#4fd1ff;
    --green:#2ec26a;--amber:#e8b23a;--red:#e8556b;
    --mono:"SF Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--mono);font-size:14px;line-height:1.45;padding:16px}
  h1,h2,h3{font-weight:600;margin:0}
  .wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
  .hidden{display:none!important}
  #gate{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
  #gate .box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:28px;max-width:440px;width:100%}
  #gate h2{color:var(--cyan);font-size:18px;margin-bottom:6px}
  #gate p{color:var(--muted);font-size:12px;margin:0 0 18px}
  input,select{background:var(--panel2);border:1px solid var(--border);color:var(--txt);font-family:var(--mono);font-size:14px;padding:9px 11px;border-radius:7px;width:100%}
  button{background:var(--cyan);color:#062;border:none;font-family:var(--mono);font-weight:700;padding:10px 16px;border-radius:7px;cursor:pointer;font-size:13px}
  button.ghost{background:transparent;border:1px solid var(--border);color:var(--txt)}
  .lock{font-size:11px;color:var(--muted);margin-top:14px;display:flex;gap:6px;align-items:flex-start}
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header .logo{color:var(--cyan);font-weight:700;letter-spacing:1px;font-size:18px}
  header .tag{color:var(--muted);font-size:12px}
  header .spot{margin-left:auto;font-size:24px;font-weight:700}
  .chip{font-size:12px;padding:2px 8px;border-radius:4px}.chip.down{background:rgba(232,85,107,.15);color:var(--red)}
  .controls{display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
  .ctl{display:flex;flex-direction:column;gap:4px}
  .ctl label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
