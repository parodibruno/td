<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Desk · BOVA11 · v2</title>
<style>
  :root{
    --bg:#0b0f14;--panel:#121821;--panel2:#0e141c;--border:#1e2733;
    --txt:#c9d4e0;--muted:#6b7a8d;--cyan:#38e1e1;--cyan2:#4fd1ff;
    --green:#2ec26a;--amber:#e8b23a;--red:#e8556b;
    --mono:"SF Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--mono);font-size:14px;line-height:1.45;padding:16px}
  h1,h2,h3{font-weight:600;margin:0}
  .wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
  .hidden{display:none!important}

  /* ===== gate de API ===== */
  #gate{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
  #gate .box{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:28px;max-width:440px;width:100%}
  #gate h2{color:var(--cyan);font-size:18px;margin-bottom:6px}
  #gate p{color:var(--muted);font-size:12px;margin:0 0 18px}
  input,select{background:var(--panel2);border:1px solid var(--border);color:var(--txt);
    font-family:var(--mono);font-size:14px;padding:9px 11px;border-radius:7px;width:100%}
  button{background:var(--cyan);color:#062;border:none;font-family:var(--mono);font-weight:700;
    padding:10px 16px;border-radius:7px;cursor:pointer;font-size:13px}
  button.ghost{background:transparent;border:1px solid var(--border);color:var(--txt)}
  .lock{font-size:11px;color:var(--muted);margin-top:14px;display:flex;gap:6px;align-items:flex-start}

  /* ===== header + controles ===== */
  header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header .logo{color:var(--cyan);font-weight:700;letter-spacing:1px;font-size:18px}
  header .tag{color:var(--muted);font-size:12px}
  header .spot{margin-left:auto;font-size:24px;font-weight:700}
  .chip{font-size:12px;padding:2px 8px;border-radius:4px}.chip.down{background:rgba(232,85,107,.15);color:var(--red)}
  .controls{display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:var(--panel);
    border:1px solid var(--border);border-radius:10px;padding:12px 14px}
  .ctl{display:flex;flex-direction:column;gap:4px}
  .ctl label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .ctl input{width:130px}
  .ctl .info{font-size:11px;color:var(--muted);align-self:flex-end}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px}
  .card .lbl{color:var(--muted);font-size:11px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
  .kv .k{color:var(--muted);white-space:nowrap}.kv .v{font-weight:600;text-align:right}
  .big{font-size:26px;font-weight:700}
  .green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.cyan{color:var(--cyan2)}.muted{color:var(--muted)}

  .status{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px;padding:3px 10px;border-radius:5px;letter-spacing:.5px}
  .st-green{background:rgba(46,194,106,.14);color:var(--green)}
  .st-amber{background:rgba(232,178,58,.16);color:var(--amber)}
  .st-red{background:rgba(232,85,107,.16);color:var(--red)}
  .dot{width:8px;height:8px;border-radius:50%}.dot.green{background:var(--green)}.dot.amber{background:var(--amber)}.dot.red{background:var(--red)}

  .strat{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:10px;overflow:hidden}
  .strat.g{border-left-color:var(--green)}.strat.a{border-left-color:var(--amber)}.strat.r{border-left-color:var(--red)}
  .strat-head{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none;flex-wrap:wrap}
  .strat-head .name{font-weight:700;color:var(--cyan2)}
  .strat-head .pl{margin-left:auto;font-size:18px;font-weight:700}
  .strat-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;padding:0 16px 14px}
  .metric{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px}
  .metric .k{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px}
  .metric .v{font-size:17px;font-weight:700;margin-top:3px}.metric .sub{color:var(--muted);font-size:10px;margin-top:2px}
  .prog{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:8px}.prog>i{display:block;height:100%;background:var(--cyan)}
  .strat-body{padding:0 16px 16px;display:none;border-top:1px solid var(--border);margin-top:2px}
  .strat.open .strat-body{display:block}
  .caret{transition:transform .15s}.strat.open .caret{transform:rotate(90deg)}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
  th,td{text-align:right;padding:6px 8px;border-bottom:1px solid var(--border)}
  th{color:var(--muted);font-weight:500;text-transform:uppercase;font-size:10px}
  td:first-child,th:first-child{text-align:left}
  .greeks{display:flex;gap:18px;margin-top:12px;flex-wrap:wrap}.greeks div{color:var(--muted);font-size:11px}.greeks b{color:var(--txt);font-size:15px;display:block}
  .trigger{background:rgba(232,85,107,.06);border:1px solid rgba(232,85,107,.2);border-radius:8px;padding:10px;margin-top:12px;font-size:12px}

  canvas{width:100%;height:300px;display:block;background:var(--panel2);border-radius:8px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .tabs button{background:var(--panel2);border:1px solid var(--border);color:var(--muted);font-weight:500;padding:6px 12px}
  .tabs button.active{color:var(--cyan2);border-color:var(--cyan2)}
  .legend{display:flex;gap:16px;font-size:11px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
  .legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px}

  .section-title{color:var(--muted);font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:4px 0}
  .note{background:rgba(79,209,255,.06);border:1px solid rgba(79,209,255,.2);border-radius:8px;padding:12px;font-size:12px;color:var(--muted)}
  .note b{
